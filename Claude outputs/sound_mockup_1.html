<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>챌린저 로드 — 소리 시안 1</title>
<style>
  :root { --bg: #0b0b14; --panel: #151527; --border: #2a2a44; --text: #e8e8f4; --muted: #8b8ba8; --a: #3ad0ff; --b: #ff5c9a; --c: #ffd84a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; line-height: 1.6; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .bar label { font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 2px solid var(--border); border-radius: 14px; padding: 14px; }
  .col.A { border-color: var(--a); } .col.B { border-color: var(--b); } .col.C { border-color: var(--c); }
  .col h2 { margin: 0; font-size: 17px; }
  .col.A h2 { color: var(--a); } .col.B h2 { color: var(--b); } .col.C h2 { color: var(--c); }
  .col .desc { color: var(--muted); font-size: 13px; margin: 4px 0 12px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .row small { color: var(--muted); display: block; font-size: 12px; }
  button { font: inherit; color: var(--text); background: #22223a; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 38px; }
  button:active { transform: scale(0.96); }
  button.all { width: 100%; margin-bottom: 8px; font-weight: 700; }
  .col.A button.all { background: rgba(58, 208, 255, 0.15); border-color: var(--a); }
  .col.B button.all { background: rgba(255, 92, 154, 0.15); border-color: var(--b); }
  .col.C button.all { background: rgba(255, 216, 74, 0.15); border-color: var(--c); }
  .note { margin-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<h1>🔊 소리 시안 1 — 같은 소리, 세 가지 느낌</h1>
<p class="lead">버튼을 눌러 들어 보세요. 모두 코드로 만든 소리예요(소리 파일 0개, 인터넷 필요 없음).<br>마음에 드는 느낌(가·나·다)을 고르시거나, "이 소리는 가, 저 소리는 다"처럼 섞어서 골라도 돼요.</p>
<div class="bar">
  <label>크기 <input type="range" id="vol" min="0" max="100" value="50"></label>
  <span id="volv" class="muted">50</span>
  <span style="color:var(--muted);font-size:13px">· 아이폰은 무음 스위치를 끄고 들어 주세요</span>
</div>
<div class="grid" id="grid"></div>
<div class="note">
  게임에 넣을 때: 설정에 소리 켜기·끄기 + 크기, 처음엔 켜짐(중간). 브라우저 규칙상 화면을 한 번 누른 뒤부터 소리가 나요.<br>
  경기 재생 중 소리는 빠르기(2배·3배)에 맞춰 너무 겹치지 않게 줄여요.
</div>
<script>
// ===== 작은 소리 엔진 (Web Audio) =====
let AC = null, MASTER = null;
function ac() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.connect(AC.destination); setVol(); }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function setVol() { if (MASTER) MASTER.gain.value = (document.getElementById("vol").value / 100) * 0.6; }
// 펄스파(레트로 게임기 느낌): duty 0.125 / 0.25 / 0.5
const PULSE = {};
function pulseWave(duty) {
  if (PULSE[duty]) return PULSE[duty];
  const n = 64, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) { im[k] = 0; re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty); }
  return (PULSE[duty] = ac().createPeriodicWave(re, im));
}
// tone: 시작(초 뒤) · 주파수 · 길이 · 파형 · 크기 · 끝 주파수(미끄러짐) · 저역 필터
function tone(o) {
  const c = ac(), t0 = c.currentTime + (o.at || 0), d = o.dur || 0.1;
  const osc = c.createOscillator(), g = c.createGain();
  if (o.duty) osc.setPeriodicWave(pulseWave(o.duty)); else osc.type = o.type || "square";
  osc.frequency.setValueAtTime(o.f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
  const v = (o.vol || 0.3), att = o.att || 0.005;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  let node = osc;
  if (o.lp) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.lp; node.connect(f); node = f; }
  node.connect(g); g.connect(MASTER);
  osc.start(t0); osc.stop(t0 + d + 0.02);
}
// noise: 칙·쾅 (필터로 높낮이)
let NOISE = null;
function noise(o) {
  const c = ac(), t0 = c.currentTime + (o.at || 0), d = o.dur || 0.1;
  if (!NOISE) { const len = c.sampleRate; NOISE = c.createBuffer(1, len, c.sampleRate); const ch = NOISE.getChannelData(0); let s = 12345; for (let i = 0; i < len; i++) { s = (s * 16807) % 2147483647; ch[i] = s / 1073741823.5 - 1; } }
  const src = c.createBufferSource(); src.buffer = NOISE;
  const f = c.createBiquadFilter(); f.type = o.hp ? "highpass" : "lowpass"; f.frequency.setValueAtTime(o.hp || o.lp || 2000, t0);
  if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t0 + d);
  const g = c.createGain(); g.gain.setValueAtTime(o.vol || 0.3, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(f); f.connect(g); g.connect(MASTER); src.start(t0); src.stop(t0 + d + 0.02);
}
const N = function (name) { // 음 이름 → 주파수 (C4 = 261.6)
  const m = /^([A-G])(#?)(\d)$/.exec(name), idx = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (idx - 9) / 12 + (Number(m[3]) - 4));
};
function arp(notes, step, o) { notes.forEach(function (n, i) { tone(Object.assign({}, o, { at: (o.at || 0) + i * step, f: N(n) })); }); }

// ===== 소리 목록 × 세 가지 느낌 =====
const SOUNDS = [
  { id: "click",   name: "버튼 누르기",        where: "모든 버튼·메뉴" },
  { id: "next",    name: "다음 주 진행",       where: "[다음 주로 진행]" },
  { id: "tick",    name: "숫자 다다닥",        where: "요약 창 점수판 (여러 번)" },
  { id: "statup",  name: "스탯 오름 ▲",        where: "훈련 결과" },
  { id: "great",   name: "훈련 대성공",        where: "대성공 카드" },
  { id: "notify",  name: "연락 알림",          where: "받은 연락·SNS" },
  { id: "kill",    name: "킬",                 where: "경기 재생" },
  { id: "fight",   name: "한타",               where: "경기 재생 큰 싸움" },
  { id: "object",  name: "용·바론",            where: "경기 재생 오브젝트" },
  { id: "setwin",  name: "세트 승리",          where: "세트 끝 (우리 팀)" },
  { id: "setlose", name: "세트 패배",          where: "세트 끝 (우리 팀)" },
  { id: "trophy",  name: "우승",               where: "우승 무대·업적" },
];
const STYLES = {
  A: { name: "가. 가볍고 귀여움", desc: "높고 짧은 '삑·뿅'. 부드러운 삼각파 위주. 오래 들어도 피곤하지 않음.", play: {
    click:   function () { tone({ f: 1400, dur: 0.04, type: "triangle", vol: 0.25 }); },
    next:    function () { tone({ f: 500, to: 1500, dur: 0.16, type: "triangle", vol: 0.25 }); },
    tick:    function () { for (let i = 0; i < 8; i++) tone({ at: i * 0.06, f: 1800 + i * 60, dur: 0.025, type: "square", vol: 0.08 }); },
    statup:  function () { arp(["E5", "A5"], 0.07, { dur: 0.12, type: "triangle", vol: 0.25 }); },
    great:   function () { arp(["C6", "E6", "G6", "C7"], 0.06, { dur: 0.2, type: "triangle", vol: 0.22 }); tone({ at: 0.24, f: N("E7"), dur: 0.4, type: "sine", vol: 0.12 }); },
    notify:  function () { tone({ f: N("A5"), dur: 0.12, type: "sine", vol: 0.3 }); tone({ at: 0.13, f: N("E6"), dur: 0.25, type: "sine", vol: 0.3 }); },
    kill:    function () { tone({ f: 900, to: 300, dur: 0.12, type: "square", vol: 0.15 }); noise({ dur: 0.06, hp: 3000, vol: 0.12 }); },
    fight:   function () { for (let i = 0; i < 4; i++) { tone({ at: i * 0.09, f: 700 - i * 80, to: 250, dur: 0.1, type: "square", vol: 0.12 }); noise({ at: i * 0.09, dur: 0.05, hp: 2500, vol: 0.1 }); } },
    object:  function () { tone({ f: 220, to: 330, dur: 0.5, type: "triangle", vol: 0.3 }); tone({ at: 0.1, f: 330, to: 440, dur: 0.45, type: "triangle", vol: 0.2 }); },
    setwin:  function () { arp(["C5", "E5", "G5", "C6"], 0.1, { dur: 0.18, type: "triangle", vol: 0.25 }); },
    setlose: function () { arp(["E4", "C4"], 0.18, { dur: 0.3, type: "triangle", vol: 0.25 }); },
    trophy:  function () { arp(["C5", "E5", "G5", "C6", "G5", "C6", "E6"], 0.11, { dur: 0.22, type: "triangle", vol: 0.25 }); tone({ at: 0.77, f: N("C6"), dur: 0.8, type: "sine", vol: 0.2 }); },
  } },
  B: { name: "나. 묵직한 e스포츠", desc: "낮고 굵은 '쿵·슈욱'. 톱니파 + 저역 필터 + 잡음. 무대·중계 느낌.", play: {
    click:   function () { tone({ f: 180, to: 90, dur: 0.06, type: "sawtooth", lp: 1200, vol: 0.3 }); },
    next:    function () { noise({ dur: 0.35, lp: 400, sweep: 4000, vol: 0.25 }); tone({ f: 110, to: 220, dur: 0.3, type: "sawtooth", lp: 900, vol: 0.2 }); },
    tick:    function () { for (let i = 0; i < 8; i++) noise({ at: i * 0.06, dur: 0.03, hp: 4000, vol: 0.12 }); },
    statup:  function () { tone({ f: 220, to: 440, dur: 0.2, type: "sawtooth", lp: 1800, vol: 0.22 }); },
    great:   function () { tone({ f: 110, dur: 0.5, type: "sawtooth", lp: 600, vol: 0.3 }); arp(["A4", "E5", "A5"], 0.08, { dur: 0.4, type: "sawtooth", lp: 2500, vol: 0.15 }); noise({ at: 0.2, dur: 0.6, hp: 6000, vol: 0.06 }); },
    notify:  function () { tone({ f: N("D5"), dur: 0.1, type: "sawtooth", lp: 2000, vol: 0.18 }); tone({ at: 0.11, f: N("A5"), dur: 0.2, type: "sawtooth", lp: 2000, vol: 0.18 }); },
    kill:    function () { tone({ f: 160, to: 50, dur: 0.18, type: "sine", vol: 0.45 }); noise({ dur: 0.12, lp: 1500, vol: 0.25 }); },
    fight:   function () { for (let i = 0; i < 4; i++) { tone({ at: i * 0.11, f: 140, to: 45, dur: 0.16, type: "sine", vol: 0.4 }); noise({ at: i * 0.11, dur: 0.1, lp: 2000, vol: 0.2 }); } },
    object:  function () { tone({ f: 55, to: 82, dur: 0.9, type: "sawtooth", lp: 400, vol: 0.4 }); noise({ dur: 0.9, lp: 300, vol: 0.15 }); },
    setwin:  function () { tone({ f: 110, dur: 0.6, type: "sawtooth", lp: 800, vol: 0.25 }); arp(["A4", "C#5", "E5"], 0.09, { dur: 0.5, type: "sawtooth", lp: 2500, vol: 0.14 }); },
    setlose: function () { tone({ f: 110, to: 70, dur: 0.7, type: "sawtooth", lp: 500, vol: 0.3 }); },
    trophy:  function () { noise({ dur: 1.4, hp: 1500, vol: 0.08 }); tone({ f: 55, dur: 1.2, type: "sawtooth", lp: 500, vol: 0.3 }); arp(["A4", "E5", "A5", "C#6", "E6"], 0.12, { dur: 0.6, type: "sawtooth", lp: 3000, vol: 0.12 }); },
  } },
  C: { name: "다. 레트로 게임기", desc: "옛날 게임기의 펄스파 '삐로롱'. 빠른 아르페지오와 칙칙 잡음. 도트 그림과 가장 비슷.", play: {
    click:   function () { tone({ f: 1046, dur: 0.035, duty: 0.25, vol: 0.18 }); },
    next:    function () { arp(["C5", "G5", "C6"], 0.04, { dur: 0.06, duty: 0.125, vol: 0.18 }); },
    tick:    function () { for (let i = 0; i < 8; i++) tone({ at: i * 0.06, f: N("A6"), dur: 0.025, duty: 0.125, vol: 0.1 }); },
    statup:  function () { arp(["C6", "E6", "G6"], 0.035, { dur: 0.06, duty: 0.25, vol: 0.18 }); },
    great:   function () { arp(["C5", "E5", "G5", "C6", "E6", "G6", "C7"], 0.035, { dur: 0.08, duty: 0.25, vol: 0.16 }); tone({ at: 0.26, f: N("C7"), dur: 0.3, duty: 0.5, vol: 0.12 }); },
    notify:  function () { tone({ f: N("B5"), dur: 0.08, duty: 0.5, vol: 0.18 }); tone({ at: 0.09, f: N("E6"), dur: 0.18, duty: 0.5, vol: 0.18 }); },
    kill:    function () { noise({ dur: 0.1, lp: 5000, vol: 0.2 }); tone({ f: 600, to: 150, dur: 0.1, duty: 0.5, vol: 0.12 }); },
    fight:   function () { for (let i = 0; i < 5; i++) noise({ at: i * 0.07, dur: 0.06, lp: 4000 - i * 500, vol: 0.2 }); },
    object:  function () { arp(["C4", "G4", "C5", "G4", "C5", "E5"], 0.07, { dur: 0.1, duty: 0.25, vol: 0.18 }); },
    setwin:  function () { arp(["G5", "G5", "G5", "C6"], 0.09, { dur: 0.1, duty: 0.25, vol: 0.18 }); tone({ at: 0.36, f: N("C6"), dur: 0.3, duty: 0.25, vol: 0.18 }); },
    setlose: function () { arp(["C5", "B4", "A#4", "A4"], 0.14, { dur: 0.16, duty: 0.5, vol: 0.16 }); },
    trophy:  function () { arp(["C5", "C5", "C5", "C5", "G#4", "A#4", "C5", "A#4", "C5"], 0.09, { dur: 0.12, duty: 0.25, vol: 0.17 }); tone({ at: 0.81, f: N("C6"), dur: 0.6, duty: 0.25, vol: 0.15 }); },
  } },
};
// 화면
const grid = document.getElementById("grid");
Object.keys(STYLES).forEach(function (k) {
  const S = STYLES[k], col = document.createElement("div");
  col.className = "col " + k;
  col.innerHTML = "<h2>" + S.name + "</h2><div class=\"desc\">" + S.desc + "</div><button class=\"all\" data-all=\"" + k + "\">▶ 전부 차례로 듣기</button>" +
    SOUNDS.map(function (s) { return "<div class=\"row\"><span>" + s.name + "<small>" + s.where + "</small></span><button data-k=\"" + k + "\" data-s=\"" + s.id + "\">▶</button></div>"; }).join("");
  grid.appendChild(col);
});
grid.addEventListener("click", function (e) {
  const b = e.target.closest("button"); if (!b) return;
  ac();
  if (b.dataset.all) { SOUNDS.forEach(function (s, i) { setTimeout(function () { STYLES[b.dataset.all].play[s.id](); }, i * 1100); }); return; }
  STYLES[b.dataset.k].play[b.dataset.s]();
});
document.getElementById("vol").addEventListener("input", function () { document.getElementById("volv").textContent = this.value; setVol(); });
</script>
</body>
</html>
