<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 27 · 이번 주 요약 창 리뉴얼</title>
<style>
:root { --bg:#07070d; --panel:#11111c; --panel-2:#181828; --text:#f1f1f7; --muted:#8a8aa6; --border:#26263d; --accent:#00e0ff; --accent2:#b44dff; --gold:#ffd23f; --good:#2bff9e; --bad:#ff3d71; --side-a:#00e0ff; --side-b:#ff5fa2; }
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
/* 시안 조작 막대 (게임에는 없음) */
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; background: #15152a; border-bottom: 1px solid var(--border); font-size: 13px; }
.bar .grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.bar .grp > span { color: var(--muted); margin-right: 2px; }
.bar button { background: #1d1d33; color: var(--text); border: 1px solid #34345a; border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; }
.bar button.on { border-color: var(--accent); background: rgba(0,224,255,.15); color: #bff6ff; }
.bar .replay { background: linear-gradient(90deg,#8b3dff,#00b8e6); border: 0; font-weight: 700; }
/* 게임 화면 자리 */
.stagewrap { display: flex; justify-content: center; padding: 16px; }
#stage { position: relative; width: 1280px; height: 720px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); }
#stage.m { width: 390px; height: 844px; }
.fake { position: absolute; inset: 0; padding: 18px; display: grid; grid-template-columns: 160px 1fr 1fr 1fr; gap: 14px; opacity: .55; }
#stage.m .fake { grid-template-columns: 1fr; }
.fake div { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; }
.fake .side { grid-row: span 3; }
#stage.m .fake .side { display: none; }
.dim { position: absolute; inset: 0; background: rgba(4,4,10,.72); backdrop-filter: blur(2px); }
.reopen { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 12px 18px; border-radius: 12px; border: 1px solid var(--accent); background: #10202a; color: #bff6ff; font: inherit; font-weight: 700; cursor: pointer; }

/* ===== 요약 창 공통 ===== */
.ws { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.92); opacity: 0; background: linear-gradient(180deg,#1a1a2e,#12121f); border: 1px solid #34345a; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(0,224,255,.08); padding: 16px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); overflow: hidden; cursor: pointer; }
.ws.open { transform: translate(-50%,-50%) scale(1); opacity: 1; transition: transform .2s cubic-bezier(.2,1.4,.4,1), opacity .15s; }
.ws-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.ws-head b { font-size: 20px; }
.ws-head span { color: var(--muted); font-size: 12px; }
.pic { position: relative; image-rendering: pixelated; background-repeat: no-repeat; border-radius: 10px; flex: none; animation-name: play; animation-iteration-count: infinite; }
@keyframes play { from { background-position: 0 0; } to { background-position: var(--end) 0; } }
.picbox { position: relative; display: inline-block; }
.cap { text-align: center; font-size: 13px; font-weight: 700; margin-top: 6px; }
.cap small { color: var(--muted); font-weight: 400; }
.rows > * { opacity: 0; transform: translateY(6px); }
.rows > .in { opacity: 1; transform: none; transition: opacity .15s, transform .2s cubic-bezier(.2,1.5,.4,1); }
.instant .rows > .in, .instant .ws, .instant * { transition: none !important; animation-duration: 0s !important; }
.instant .pic { animation-duration: 4s !important; }

/* 경기 줄 */
.mrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--border); margin-bottom: 6px; font-size: 13px; }
.mrow.win { border-color: rgba(0,224,255,.55); background: rgba(0,224,255,.09); }
.mrow.lose { border-color: rgba(255,95,162,.45); background: rgba(255,95,162,.07); }
.mrow .mtxt { flex: 1; min-width: 0; }
.mrow .res { font-weight: 800; white-space: nowrap; }
.win .res { color: var(--side-a); } .lose .res { color: var(--side-b); }
/* 가: 점수판 넘기기 */
.flip { display: inline-flex; align-items: center; gap: 3px; font-family: Consolas, monospace; }
.flip .d { display: inline-block; width: 22px; height: 28px; line-height: 28px; text-align: center; font-size: 19px; font-weight: 800; background: #0b0b16; border: 1px solid #3a3a5c; border-radius: 5px; position: relative; overflow: hidden; }
.flip .d::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.6); }
.flip .d.tick { animation: tick .08s linear; }
@keyframes tick { 0% { transform: rotateX(70deg); } 100% { transform: none; } }
.win .flip .d { color: var(--side-a); border-color: rgba(0,224,255,.6); }
.lose .flip .d { color: var(--side-b); border-color: rgba(255,95,162,.5); }
/* 나: 넥서스 */
.nex { position: relative; display: inline-flex; gap: 6px; align-items: center; width: 58px; height: 28px; }
.nex canvas { width: 26px; height: 26px; image-rendering: pixelated; }
.frag { position: absolute; width: 4px; height: 4px; pointer-events: none; }
.slide { display: inline-block; transform: translateX(-12px); opacity: 0; }
.slide.in { transform: none; opacity: 1; transition: all .2s ease-out; }
/* 다: 경기 채팅 */
.chat { font-family: Consolas, "Malgun Gothic", monospace; font-size: 12.5px; }
.chat .who { color: var(--side-a); }
.lose .chat { color: #9a9ab4; } .lose .chat .who { color: #9a9ab4; }
.bubble { position: absolute; transform: translate(-50%,-100%) scale(0); background: #fff; color: #111; font-weight: 900; font-size: 14px; padding: 1px 7px; border-radius: 8px; transition: transform .18s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; margin-left: -4px; border: 4px solid transparent; border-top-color: #fff; border-bottom: 0; }
.bubble.show { transform: translate(-50%,-100%) scale(1); }
.bubble.sad { background: #3a3a55; color: #cfcfe6; } .bubble.sad::after { border-top-color: #3a3a55; }

/* 스탯 칩 · 숫자 · 막대 */
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; }
.chip { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: rgba(43,255,158,.08); border: 1px solid rgba(43,255,158,.35); transform: scale(0); }
.chip b { color: var(--good); }
.chip.in { transform: scale(1); transition: transform .18s cubic-bezier(.2,1.8,.4,1); }
.chip.big { border-color: #fff; background: rgba(255,255,255,.12); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 13px; align-items: center; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div:nth-child(even) { text-align: right; font-weight: 700; }
.up { color: var(--good); } .down { color: var(--bad); }
.barl { display: grid; grid-template-columns: 52px 1fr 40px; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 5px; }
.barl .t { height: 8px; border-radius: 99px; background: #23233a; overflow: hidden; }
.barl .f { height: 100%; border-radius: 99px; background: linear-gradient(90deg,#8b3dff,#00e0ff); transition: width .35s ease-out; }
.barl.cd .f { background: linear-gradient(90deg,#b44dff,#ff7ad9); }
.barl .n { text-align: right; font-weight: 700; }
.special { margin-top: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid #fff; background: radial-gradient(circle at 20% 50%, rgba(255,255,255,.22), rgba(255,255,255,.04)); font-weight: 800; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.special .ic { font-size: 22px; }
.foot { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.foot button { border: 0; border-radius: 12px; padding: 11px; font: inherit; font-weight: 800; color: #fff; background: linear-gradient(90deg,#8b3dff,#00b8e6); cursor: pointer; }
.foot .hint { text-align: center; color: var(--muted); font-size: 11.5px; }
.skiphint { position: absolute; right: 14px; bottom: 10px; font-size: 11px; color: var(--muted); }

/* 큰 점수판 (경기 결과가 그림 위에 크게 → 작아지며 줄로) */
.bigres { position: absolute; z-index: 20; transform: translate(-50%,-50%); padding: 12px 26px 14px; border-radius: 16px; background: rgba(8,8,18,.92); border: 2px solid #3a3a5c; box-shadow: 0 10px 40px rgba(0,0,0,.7); text-align: center; pointer-events: none; white-space: nowrap; }
.bigres .bl { font-size: 13px; color: #cfcfe6; margin-bottom: 8px; }
.bigres .flip { gap: 8px; font-size: 0; }
.bigres .flip > span { font-size: 34px; font-weight: 900; color: #fff; }
.bigres .flip .d { width: 58px; height: 72px; line-height: 72px; font-size: 52px; border-radius: 10px; border-width: 2px; }
.bigres .bw { height: 30px; margin-top: 6px; font-size: 24px; font-weight: 900; letter-spacing: 4px; }
.bigres.win { border-color: var(--side-a); box-shadow: 0 0 30px rgba(0,224,255,.45), 0 10px 40px rgba(0,0,0,.7); }
.bigres.lose { border-color: var(--side-b); box-shadow: 0 0 30px rgba(255,95,162,.35), 0 10px 40px rgba(0,0,0,.7); }
.bigres.win .d, .bigres.win .bw { color: var(--side-a); border-color: rgba(0,224,255,.7); }
.bigres.lose .d, .bigres.lose .bw { color: var(--side-b); border-color: rgba(255,95,162,.6); }
/* 하얀 반짝임 */
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; border-radius: 18px; }
.flash.go { animation: flash .15s ease-out; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.star { position: absolute; width: 6px; height: 6px; background: #fff; pointer-events: none; box-shadow: 0 0 6px #fff; }
.star::before, .star::after { content: ""; position: absolute; background: #fff; }
.star::before { left: 2px; top: -4px; width: 2px; height: 14px; } .star::after { top: 2px; left: -4px; height: 2px; width: 14px; }
.glow { filter: drop-shadow(0 0 6px rgba(255,255,255,.9)); }
.fire { filter: drop-shadow(0 0 5px rgba(255,150,40,.95)); animation-name: play, firepulse; }
@keyframes firepulse { 0%,100% { filter: drop-shadow(0 0 3px rgba(255,150,40,.7)); } 50% { filter: drop-shadow(0 0 9px rgba(255,120,20,1)); } }

/* ===== A. 세로 카드 ===== */
.ws.A { width: 400px; }
.ws.A .picbox { display: block; width: max-content; margin: 0 auto 10px; }
/* ===== B. 무대 (그림 왼쪽 크게) ===== */
.ws.B { width: 780px; }
.ws.B .body { display: flex; gap: 16px; align-items: flex-start; }
.ws.B .right { flex: 1; min-width: 0; }
#stage.m .ws.B { width: 366px; }
#stage.m .ws.B .body { flex-direction: column; align-items: center; }
#stage.m .ws.B .right { width: 100%; }
/* ===== C. 중계 화면 (그림 위에 자막) ===== */
.ws.C { width: 600px; padding: 0; }
.ws.C .screen { position: relative; }
.ws.C .pic { border-radius: 18px 18px 0 0; }
.ws.C .ws-head { position: absolute; left: 12px; top: 10px; right: 12px; margin: 0; text-shadow: 0 2px 4px #000; }
.ws.C .lower { position: absolute; left: 0; right: 0; bottom: 8px; padding: 0 10px; }
.ws.C .lower .mrow { background: rgba(10,10,22,.88); backdrop-filter: blur(2px); transform: translateX(-30px); }
.ws.C .lower .mrow.in { transform: none; }
.ws.C .rest { padding: 12px 16px 14px; }
.ws.C .chips { position: absolute; right: 10px; top: 40px; flex-direction: column; align-items: flex-end; }
#stage.m .ws.C { width: 366px; }
/* ===== D. 중계 화면 2 (스탯은 그림 위 오른쪽, 경기 결과는 그림 아래) — 사용자 선택 ===== */
.ws.D { width: 520px; padding: 0; }
.ws.D .screen { position: relative; display: flex; justify-content: center; background: radial-gradient(ellipse at 50% 60%, #1c1c34, #0d0d18 70%); border-radius: 18px 18px 0 0; padding-top: 6px; }
.ws.D .ws-head { position: absolute; left: 14px; top: 10px; right: 14px; margin: 0; text-shadow: 0 2px 4px #000; }
.ws.D .ovl { position: absolute; right: 10px; top: 42px; }
.ws.D .ovl .chips { flex-direction: column; align-items: flex-end; }
.ws.D .chip { background: rgba(8,20,16,.85); }
.ws.D .cap { position: absolute; left: 0; right: 0; bottom: 6px; text-shadow: 0 1px 3px #000; }
.ws.D .rest { padding: 12px 16px 14px; }
.ws.D .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; align-items: start; }
#stage.m .ws.D { width: 366px; }
.ws.D.champ .screen { padding-top: 40px; }
#stage.m .ws.D .two { grid-template-columns: 1fr; }
</style>
</head>
<body>
<div class="bar">
  <div class="grp" id="g-sc"><span>상황</span></div>
  <div class="grp" id="g-lay"><span>창 모양</span></div>
  <div class="grp" id="g-rv"><span>승패 연출</span></div>
  <div class="grp" id="g-tw"><span>우승 그림</span></div>
  <div class="grp" id="g-sp"><span>빠르기</span></div>
  <div class="grp" id="g-dev"><span>화면</span></div>
  <button class="replay" id="replay">▶ 다시 재생</button>
</div>
<div class="stagewrap"><div id="stage"></div></div>

<!-- 게임의 진짜 그림 코드 (대시보드 '이번 주 행동 그림') -->
<script src="../data/ui.js"></script>
<script src="../data/room.js"></script>
<script src="../js/room.js"></script>
<script>
// ===== 시안 전용: 새 동작 그림 (적용 때 data/room.js ROOM_SPRITES로 옮길 것) =====
const NEW_SPR = {
  typeA: { split: 6, rows: ["..HHHH.", "..ESHH.", "..SSSH.", "..SSS..", "..UUUU.", "SSUVUU.", "..UVUU.", "..UUUU.", "PPPPP..", "P...P..", "K...K.."] },
  typeB: { split: 6, rows: ["..HHHH.", "..ESHH.", "..SSSH.", "..SSS..", "..UUUU.", ".SUVUU.", "S.UVUU.", "..UUUU.", "PPPPP..", "P...P..", "K...K.."] },
  cheer: { split: 11, rows: ["S.HHHH.S", "S.HSSH.S", "U.ESSE.U", "UUSSSSUU", ".UUUUUU.", "..UVVU..", "..UUUU..", "..UUUU..", "..PPPP..", "..P..P..", "..K..K.."] },
  slump: { split: 0, rows: [".HHHH.", ".HHHH.", ".UDDU.", "SUUUUS", "SUVVUS", "SUUUUS", ".UUUU.", ".PPPP.", ".P..P.", ".K..K."] }, // 고개 + 어깨 처짐 (키 1칸 작게)
  trophyA: { split: 16, rows: ["..TTTTTT..", ".T.TGGT.T.", "..TTTTTT..", "...TTTT...", "....GG....", "..STTTTS..", "..SHHHHS..", "..SHSSHS..", "..UESSEU..", "..USSSSU..", "..UUUUUU..", "...UVVU...", "...UUUU...", "...PPPP...", "...P..P...", "...K..K..."] },
  trophyB: { split: 16, rows: ["W.TTTTTT..", ".T.TWGT.T.", "..TTTTTT.W", "...TTTT...", "....GG....", "..STTTTS..", "..SHHHHS..", "..SHSSHS..", "..UESSEU..", "..USSSSU..", "..UUUUUU..", "...UVVU...", "...UUUU...", "...PPPP...", "...P..P...", "...K..K..."] }, // 금빛 반짝 (하얀 점)
};
const UNI = ["#e4002b", "#f4f4f8"];
function person(skin, hair) { return roomPersonColors({ skin: skin, hairC: hair }, UNI); }
const ME = Object.assign(person(1, 0), { T: "#ffd23f", G: "#a97c1d", W: "#ffffff" });
const MATES = [person(0, 2), person(2, 1), person(1, 3), person(0, 4)];

// 장면 → 20장 띠 (게임 roomDrawFrame을 그대로 쓰고, 동작만 바꿔 끼움)
const STRIPS = {};
function strip(scene, pose) {
  if (pose === "title" && cur.tw !== "base") return titleStrip(cur.tw);
  const key = scene + "|" + pose;
  if (STRIPS[key]) return STRIPS[key];
  const R = ROOM_RULES, cv = document.createElement("canvas");
  cv.width = R.w * R.frames; cv.height = R.h;
  const g = cv.getContext("2d");
  const keepFront = ROOM_SPRITES.front, keepSit = ROOM_SPRITES.sitL;
  const cx = { f: 0, empty: false, team: UNI, me: ME, mates: MATES, trophies: scene.indexOf("rest") === 0 ? ["worlds", "playoffs", "msi"] : [] };
  for (let f = 0; f < R.frames; f++) {
    cx.f = f;
    let n = 0;
    if (pose === "type" || pose === "fire") ROOM_SPRITES.sitL = f % 4 < 2 ? NEW_SPR.typeA : NEW_SPR.typeB;
    if (pose === "win" || pose === "title") Object.defineProperty(ROOM_SPRITES, "front", { configurable: true, get: function () { n++; return pose === "title" && n === 3 ? (f % 6 < 3 ? NEW_SPR.trophyA : NEW_SPR.trophyB) : NEW_SPR.cheer; } });
    if (pose === "lose") Object.defineProperty(ROOM_SPRITES, "front", { configurable: true, get: function () { return NEW_SPR.slump; } });
    const rs = roomDrawFrame(ROOM_SCENES[scene], cx);
    if (pose === "fire") fireAround(rs, roomDrawFrame(ROOM_SCENES[scene], Object.assign({}, cx, { empty: true })), f);
    if (pose === "lose") for (let i = 0; i < rs.d.length; i += 4) { rs.d[i] *= 0.62; rs.d[i + 1] *= 0.62; rs.d[i + 2] *= 0.7; }
    g.putImageData(new ImageData(rs.d, R.w, R.h), f * R.w, 0);
    Object.defineProperty(ROOM_SPRITES, "front", { configurable: true, writable: true, value: keepFront });
    ROOM_SPRITES.sitL = keepSit;
  }
  return (STRIPS[key] = cv.toDataURL());
}
// ===== 우승 그림 3가지 (시안) =====
function hsh(i, k) { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); }
function isoP(x, y, z) { const R = ROOM_RULES, W = R.roomW, H = R.roomH, oy = H + 3, ox = W + 2 + Math.floor((R.w - (2 * W + 2)) / 2); return [ox + (x - y), oy + (x + y) / 2 - z]; }
// 그림 한 장 위에 도트 그림 붙이기 (k배 블록). 아래 가운데 = (bx, by)
function blit(rs, spr, bx, by, colors, k, lift) {
  k = k || 1;
  const rows = spr.rows, w = rows[0].length, h = rows.length, x0 = Math.round(bx - w * k / 2), y0 = Math.round(by - h * k) - (lift || 0);
  rows.forEach(function (r, ry) {
    r.split("").forEach(function (ch, rx) {
      if (ch === "." || !colors[ch]) return;
      for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) roomPx(rs, x0 + rx * k + a, y0 + ry * k + b, colors[ch]);
    });
  });
}
const CONF = ["#e4002b", "#ffffff", "#ffd23f", "#00e0ff", "#ff8fc8"];
// 위에서 떨어지며 팔랑이는 색종이 (장 번호로만 정함 → 20장마다 자연스럽게 이어짐)
function confetti(rs, f, n, seed) {
  const H = rs.h + 8;
  for (let i = 0; i < n; i++) {
    const x = Math.floor(hsh(i, seed) * rs.w + Math.sin((f / 20) * 6.283 + i) * 2), sp = 1 + Math.floor(hsh(i, seed + 1) * 3);
    const y = Math.floor((hsh(i, seed + 2) * H + f * sp * H / 20) % H) - 4;
    const c = CONF[i % CONF.length];
    roomPx(rs, x, y, c);
    if ((f + i) % 3) roomPx(rs, x + 1, y, c); else roomPx(rs, x, y + 1, c);
  }
}
// 불꽃 기둥: 높이가 출렁이고 꼭대기에서 불씨가 튐
function pyro(rs, x, by, f, ph) {
  const hgt = 10 + Math.round(6 * Math.abs(Math.sin((f + ph) * 0.9))), cols = ["#ffffff", "#fff0a0", "#ffd23f", "#ff9a2e", "#ff5a1f"];
  for (let y = 0; y < hgt; y++) {
    const w = y < 3 ? 2 : 1, c = cols[Math.min(4, Math.floor(y / hgt * 5))];
    for (let d = -w; d <= w; d++) if (d === 0 || hsh(x * 31 + y + d, f) > 0.25) roomPx(rs, x + d, by - y, c);
  }
  for (let i = 0; i < 4; i++) roomPx(rs, x + Math.round((hsh(i, f + ph) - 0.5) * 8), by - hgt - 1 - Math.floor(hsh(i + 9, f + ph) * 5), cols[i % 3]);
}
const FONT3 = { C: ["###", "#..", "#..", "#..", "###"], H: ["#.#", "#.#", "###", "#.#", "#.#"], A: [".#.", "#.#", "###", "#.#", "#.#"], M: ["#...#", "##.##", "#.#.#", "#...#", "#...#"], P: ["##.", "#.#", "##.", "#..", "#.."], I: ["###", ".#.", ".#.", ".#.", "###"], O: ["###", "#.#", "#.#", "#.#", "###"], N: ["#..#", "##.#", "#.##", "#..#", "#..#"], S: ["###", "#..", "###", "..#", "###"] };

function nexus(cv, a, b) { // 13×13 도트 넥서스 (다이아몬드 수정 + 받침)
  const g = cv.getContext("2d"), rows = ["......b......", ".....bab.....", "....baaab....", "...baaaaab...", "....baaab....", ".....bab.....", "......b......", "....kkkkk....", "...kkkkkkk...", "..kkkkkkkkk..", "..kk.....kk..", "..kk.....kk..", "............."];

  }

  const parts = html.split(/(<[^>]+>)/); let out = "", i = 0, delay = 0;
